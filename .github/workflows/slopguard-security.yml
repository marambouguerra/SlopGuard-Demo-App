
name: SlopGuard Security Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Scan Demo App Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Demo App
        uses: actions/checkout@v4
        with:
          path: demo-app
          persist-credentials: false

      - name: Checkout private SlopGuard
        uses: actions/checkout@v4
        with:
          repository: marambouguerra/slop-guard
          ref: main
          path: slopguard
          token: ${{ secrets.SLOPGUARD_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install scanner dependencies
        run: |
          python -m pip install -r slopguard/scanner-requirements.txt

      - name: DEBUG - Check files and paths
        run: |
          echo "========== DEBUG START =========="
          pwd
          echo "Workspace:"
          ls -la
          echo "Demo App:"
          ls -la demo-app
          echo "Requirements file check:"
          if test -f demo-app/requirements.txt; then
            echo "FOUND: requirements.txt"
            cat demo-app/requirements.txt
          else
            echo "MISSING: requirements.txt"
            exit 1
          fi
          echo "========== DEBUG END =========="

      - name: Run SlopGuard
        env:
          SLOPGUARD_REQUIREMENTS_FILE: ${{ github.workspace }}/demo-app/requirements.txt
        run: |
          echo "SCANNING FILE: $SLOPGUARD_REQUIREMENTS_FILE"
          python slopguard/slopguard.py
