
name: SlopGuard Security Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Scan Demo App Dependencies
    runs-on: ubuntu-latest

    steps:
      # Download the public Demo App
      - name: Checkout Demo App
        uses: actions/checkout@v4
        with:
          path: demo-app
          persist-credentials: false

      # Download the private SlopGuard scanner
      - name: Checkout private SlopGuard
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/SlopGuard
          ref: main
          path: slopguard
          token: ${{ secrets.SLOPGUARD_REPO_TOKEN }}
          persist-credentials: false

      # Set up Python for the scanner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Install only SlopGuard's own tooling
      - name: Install scanner dependencies
        run: |
          python -m pip install -r slopguard/scanner-requirements.txt

      # Scan application dependencies before installation
      - name: Run SlopGuard
        env:
          SLOPGUARD_REQUIREMENTS_FILE: ${{ github.workspace }}/demo-app/requirements.txt
        run: |
          python slopguard/slopguard.py
